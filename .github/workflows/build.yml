# Build and test Gleipnir on Linux and Windows.
#
# This exists because Linux support was written on a Windows machine and could
# not be verified there: MinGW's headers refuse to compile with _WIN32
# undefined, so not even a syntax check of the POSIX branch was possible
# locally.  Every platform claim in the README should be backed by a run of
# this workflow rather than by inspection.
#
# If the Linux job fails on the first push, the README's platform line is wrong
# and should be corrected before the failure is.

name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install zlib headers
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Build (static, so it runs on any distro regardless of glibc)
        run: make LDFLAGS=-static

      - name: Version and round trip
        run: make test LDFLAGS=-static

      - name: Confirm it is statically linked
        run: |
          file gleipnir
          if ! file gleipnir | grep -q "statically linked"; then
            echo "binary is NOT static -- it would fail on older distros" >&2
            exit 1
          fi
          ldd gleipnir || true

      - name: Round-trip fuzz across thread counts
        run: python3 scripts/tfuzz.py --v2 gleipnir

      - name: Corruption fuzz
        run: python3 scripts/gfuzz.py 40 --exe gleipnir

      - name: Archive built on Linux must read on Linux
        run: |
          mkdir -p /tmp/xplat/src
          head -c 300000 /dev/urandom > /tmp/xplat/src/rand.bin
          cp gleipnir.c /tmp/xplat/src/code.c
          ./gleipnir c -3 -q /tmp/xplat/a.gl /tmp/xplat/src
          ./gleipnir t /tmp/xplat/a.gl
          ./gleipnir x -q /tmp/xplat/a.gl /tmp/xplat/out
          cmp /tmp/xplat/src/rand.bin /tmp/xplat/out/rand.bin
          cmp /tmp/xplat/src/code.c  /tmp/xplat/out/code.c

      - name: Upload the Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: gleipnir-linux-x86_64
          path: gleipnir

      - name: Keep an archive for the cross-platform job
        uses: actions/upload-artifact@v7
        with:
          name: archive-from-linux
          path: /tmp/xplat/a.gl

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      # diffutils supplies cmp, which `make test` uses to compare the
      # round-tripped files.  It is not in a base MSYS2 install, and without it
      # the target fails at the comparison having already built and
      # round-tripped correctly -- which reads as a compressor fault and is
      # not one.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zlib
            make
            python
            diffutils

      # LDFLAGS=-static on every make call: the target is `gleipnir` but gcc
      # emits `gleipnir.exe`, so make relinks each time and a bare `make test`
      # would drop -static and pull libgcc/libwinpthread back in.
      - name: Build (static -- KERNEL32 + UCRT only, no MSYS2 DLLs)
        run: make CC=gcc LDFLAGS=-static

      - name: Version and round trip
        run: make test CC=gcc LDFLAGS=-static

      - name: Confirm no non-system runtime DLLs
        run: |
          objdump -p gleipnir.exe | grep -i 'DLL Name' || true
          if objdump -p gleipnir.exe | grep -iE 'libgcc|winpthread|libstdc'; then
            echo "unexpected DLL dependency -- it would not start on a clean Windows" >&2
            exit 1
          fi

      - name: Upload the Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: gleipnir-windows-x86_64
          path: gleipnir.exe

      # Version comes from the git tag on a tag build (refs/tags/v1.2.3 -> 1.2.3)
      # and falls back to the .iss default otherwise. It names the installer and
      # is written into its version resource.
      - name: Determine version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
          else
            ver="1.0.0"
          fi
          echo "GLEIPNIR_VER=$ver" >> "$GITHUB_ENV"
          echo "version: $ver"

      - name: Stage the files the installer bundles
        run: cp gleipnir.exe dist/gleipnir.exe

      - name: Build the one-click installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVer=$env:GLEIPNIR_VER" "packaging\gleipnir.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }
          $setup = "dist\gleipnir-$env:GLEIPNIR_VER-setup.exe"
          if (-not (Test-Path $setup)) { throw "installer $setup was not produced" }

      - name: Upload the one-click installer
        uses: actions/upload-artifact@v7
        with:
          name: gleipnir-windows-setup
          path: dist/gleipnir-*-setup.exe

      # The same gleipnir.exe plus the script installer and text docs, for people
      # who would rather not run an unsigned .exe installer.
      - name: Build the Windows zip bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle | Out-Null
          Copy-Item gleipnir.exe, dist/install.ps1, dist/uninstall.ps1, `
                    dist/README.txt, dist/USAGE.txt bundle/
          Compress-Archive -Path bundle/* -DestinationPath gleipnir-windows-x86_64.zip -Force

      - name: Upload the Windows zip bundle
        uses: actions/upload-artifact@v7
        with:
          name: gleipnir-windows-zip
          path: gleipnir-windows-x86_64.zip

  # The format claim in the README is that an archive written on one platform
  # reads on the other.  That is worth testing rather than asserting: it is
  # exactly the sort of thing that breaks quietly on a struct padding or
  # endianness assumption and is only noticed by whoever needed the restore.
  cross-platform:
    needs: [linux, windows]
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zlib
            make
      - name: Build for this platform
        run: make CC=gcc
      - uses: actions/download-artifact@v8
        with:
          name: archive-from-linux
          path: .
      - name: Read the Linux-written archive on Windows
        run: |
          ./gleipnir t a.gl
          ./gleipnir l a.gl
          ./gleipnir x -q a.gl out
          test -f out/code.c && test -f out/rand.bin
          echo "cross-platform read OK"

  # Publish. Runs only when a version tag (v1.2.3) is pushed, and only after the
  # build/test jobs above have passed on that same commit -- so nothing ships
  # that has not round-tripped and cross-platform-verified. It gathers the four
  # binaries built above, writes a SHA-256 next to each, and attaches all eight
  # files to the release for the tag (creating it with generated notes if it
  # does not exist yet). Re-running is safe: --clobber replaces same-named
  # assets rather than erroring.
  release:
    needs: [linux, windows, cross-platform]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine version
        run: echo "GLEIPNIR_VER=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Download every build artifact
        uses: actions/download-artifact@v8
        with:
          path: art

      - name: Lay out the release files with checksums
        run: |
          set -euo pipefail
          mkdir -p out
          cp "art/gleipnir-linux-x86_64/gleipnir"            "out/gleipnir-linux-x86_64"
          cp "art/gleipnir-windows-x86_64/gleipnir.exe"      "out/gleipnir.exe"
          cp "art/gleipnir-windows-zip/gleipnir-windows-x86_64.zip" "out/"
          cp art/gleipnir-windows-setup/gleipnir-*-setup.exe "out/"
          cd out
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - name: Create or update the release, attach the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${GLEIPNIR_VER}"
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" \
              --title "Gleipnir ${GLEIPNIR_VER}" --generate-notes
          fi
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber out/*
