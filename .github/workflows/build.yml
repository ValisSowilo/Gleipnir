# Build and test Gleipnir on Linux, Windows and macOS.
#
# This exists because Linux support was written on a Windows machine and could
# not be verified there: MinGW's headers refuse to compile with _WIN32
# undefined, so not even a syntax check of the POSIX branch was possible
# locally.  Every platform claim in the README should be backed by a run of
# this workflow rather than by inspection.
#
# If the Linux job fails on the first push, the README's platform line is wrong
# and should be corrected before the failure is.
#
# The macOS job is the same argument one step further: the Darwin branches were
# also written on a Windows machine, against Apple's documented behaviour rather
# than against a Mac.  It is the only job here that is not x86-64, so it is also
# the only place the archive format gets read on a different architecture.

name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install zlib headers
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Build (static, so it runs on any distro regardless of glibc)
        run: make LDFLAGS=-static

      - name: Version and round trip
        run: make test LDFLAGS=-static

      - name: Confirm it is statically linked
        run: |
          file gleipnir
          if ! file gleipnir | grep -q "statically linked"; then
            echo "binary is NOT static -- it would fail on older distros" >&2
            exit 1
          fi
          ldd gleipnir || true

      - name: Round-trip fuzz across thread counts
        run: python3 scripts/tfuzz.py --v2 gleipnir

      - name: Corruption fuzz
        run: python3 scripts/gfuzz.py 40 --exe gleipnir

      # Archives that pass every structural check but whose segment fields
      # contradict each other.  gfuzz damages valid archives at random, so its
      # mutants nearly always fail a checksum before the decoder reads a field;
      # this builds the ones that do not.
      - name: Semantic fuzz
        run: python3 scripts/sfuzz.py --exe gleipnir

      # UBSan defaults to print-and-continue: it does not abort, and it does not
      # change the exit status.  A finding is therefore invisible to anything
      # that only checks exit codes -- which is exactly how a left shift of a
      # negative value in sm_update(), the single hottest line in the codec,
      # survived a full ASan+UBSan run and had to be reported by a user.
      # -fno-sanitize-recover is the whole point of this step: it turns those
      # diagnostics into failures.
      - name: Undefined behaviour (aborts on any finding)
        run: |
          gcc -O1 -g -fsanitize=undefined -fno-sanitize-recover=all \
              -ffp-contract=off -o gleipnir-ubsan gleipnir.c -lz -lm -lpthread
          mkdir -p /tmp/ub/out
          head -c 400000 /dev/urandom > /tmp/ub/rand.bin
          cp gleipnir.c /tmp/ub/code.c
          printf 'ACGTACGT%.0s' $(seq 1 20000) > /tmp/ub/alpha.txt
          for lvl in 1 5 9 f1 f2; do
            ./gleipnir-ubsan c -$lvl -t2 -q /tmp/ub/a-$lvl.gl \
              /tmp/ub/rand.bin /tmp/ub/code.c /tmp/ub/alpha.txt
            ./gleipnir-ubsan x -q /tmp/ub/a-$lvl.gl /tmp/ub/out
            cmp /tmp/ub/code.c  /tmp/ub/out/code.c
            cmp /tmp/ub/rand.bin /tmp/ub/out/rand.bin
          done
          echo "round-trip path is free of undefined behaviour"
          # And the same for the parser: sfuzz drives every rejection path, and
          # a UBSan abort there surfaces as an exit status it refuses to accept.
          python3 scripts/sfuzz.py --exe gleipnir-ubsan

      - name: Archive built on Linux must read on Linux
        run: |
          mkdir -p /tmp/xplat/src
          head -c 300000 /dev/urandom > /tmp/xplat/src/rand.bin
          cp gleipnir.c /tmp/xplat/src/code.c
          ./gleipnir c -3 -q /tmp/xplat/a.gl /tmp/xplat/src
          ./gleipnir t /tmp/xplat/a.gl
          ./gleipnir x -q /tmp/xplat/a.gl /tmp/xplat/out
          cmp /tmp/xplat/src/rand.bin /tmp/xplat/out/rand.bin
          cmp /tmp/xplat/src/code.c  /tmp/xplat/out/code.c

      - name: Upload the Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: gleipnir-linux-x86_64
          path: gleipnir

      - name: Keep an archive for the cross-platform job
        uses: actions/upload-artifact@v7
        with:
          name: archive-from-linux
          path: /tmp/xplat/a.gl

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      # diffutils supplies cmp, which `make test` uses to compare the
      # round-tripped files.  It is not in a base MSYS2 install, and without it
      # the target fails at the comparison having already built and
      # round-tripped correctly -- which reads as a compressor fault and is
      # not one.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zlib
            make
            python
            diffutils

      # LDFLAGS=-static on every make call: the target is `gleipnir` but gcc
      # emits `gleipnir.exe`, so make relinks each time and a bare `make test`
      # would drop -static and pull libgcc/libwinpthread back in.
      - name: Build (static -- KERNEL32 + UCRT only, no MSYS2 DLLs)
        run: make CC=gcc LDFLAGS=-static

      - name: Version and round trip
        run: make test CC=gcc LDFLAGS=-static

      - name: Confirm no non-system runtime DLLs
        run: |
          objdump -p gleipnir.exe | grep -i 'DLL Name' || true
          if objdump -p gleipnir.exe | grep -iE 'libgcc|winpthread|libstdc'; then
            echo "unexpected DLL dependency -- it would not start on a clean Windows" >&2
            exit 1
          fi

      # This one matters more here than anywhere else.  A member name like
      # "..\..\x" is an ordinary filename on POSIX and three path components on
      # Windows, so the containment check in sfuzz.py can only fail on this
      # runner -- and it did, before the name check learned to split on both
      # separators.  sfuzz needs no corpus, so it runs cheaply here.
      - name: Semantic fuzz (path containment is Windows-specific)
        run: python scripts/sfuzz.py --exe gleipnir.exe

      - name: Upload the Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: gleipnir-windows-x86_64
          path: gleipnir.exe

      # Version comes from the git tag on a tag build (refs/tags/v1.2.3 -> 1.2.3)
      # and falls back to the .iss default otherwise. It names the installer and
      # is written into its version resource.
      - name: Determine version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
          else
            ver="1.0.1"
          fi
          echo "GLEIPNIR_VER=$ver" >> "$GITHUB_ENV"
          echo "version: $ver"

      - name: Stage the files the installer bundles
        run: cp gleipnir.exe dist/gleipnir.exe

      - name: Build the one-click installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVer=$env:GLEIPNIR_VER" "packaging\gleipnir.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }
          $setup = "dist\gleipnir-$env:GLEIPNIR_VER-setup.exe"
          if (-not (Test-Path $setup)) { throw "installer $setup was not produced" }

      - name: Upload the one-click installer
        uses: actions/upload-artifact@v7
        with:
          name: gleipnir-windows-setup
          path: dist/gleipnir-*-setup.exe

      # The same gleipnir.exe plus the script installer and text docs, for people
      # who would rather not run an unsigned .exe installer.
      - name: Build the Windows zip bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle | Out-Null
          Copy-Item gleipnir.exe, dist/install.ps1, dist/uninstall.ps1, `
                    dist/README.txt, dist/USAGE.txt bundle/
          Compress-Archive -Path bundle/* -DestinationPath gleipnir-windows-x86_64.zip -Force

      - name: Upload the Windows zip bundle
        uses: actions/upload-artifact@v7
        with:
          name: gleipnir-windows-zip
          path: gleipnir-windows-x86_64.zip

  # macOS, on Apple Silicon -- macos-latest runners are arm64.  This is the only
  # job in the file that is not x86, and it is here because three separate
  # defects were only reachable from it:
  #
  #   * -march=x86-64-v2 was the unconditional default.  clang on arm64 rejects
  #     that flag rather than ignoring it, so `make` failed on its first command
  #     while the README said building was supported everywhere.
  #   * ram_total() asked sysconf(_SC_PHYS_PAGES), which is a Linux extension
  #     that Darwin does not implement.  When that yields nothing, threads_for()
  #     reads the zero as "cannot tell" and skips the memory clamp entirely --
  #     so -t0 at -9 asks for one full model per core with nothing stopping it.
  #   * ru_maxrss is kilobytes on Linux and bytes on Darwin, so every peak-memory
  #     figure printed on a Mac was 1024x too large.
  #
  # It also gives the archive format its first non-x86 reader, which is the real
  # test of the "written on one platform, read on another" claim -- Windows and
  # Linux share an architecture, so agreeing proves less than it looks.
  #
  # Deliberately NOT in the release job's `needs`: macOS is supported but not
  # yet proven, and a red run here should be visible without blocking binaries
  # for the two platforms that are. Promote it once it has been green a while.
  macos:
    needs: linux
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show what we are actually on
        run: |
          uname -m
          cc --version
          make --version | head -1

      - name: Build (no -march; the flag does not exist on arm64)
        run: make

      - name: Version and round trip
        run: make test

      - name: Semantic fuzz
        run: python3 scripts/sfuzz.py --exe gleipnir

      - name: Round-trip fuzz across thread counts
        run: python3 scripts/tfuzz.py --v2 gleipnir

      # -t0 is the path that loses its guard rail when ram_total() cannot
      # answer, so exercise it rather than only the single-threaded default.
      - name: All cores, largest preset the runner can hold
        run: |
          mkdir -p /tmp/mt/src
          head -c 2000000 /dev/urandom > /tmp/mt/src/rand.bin
          cp gleipnir.c /tmp/mt/src/code.c
          ./gleipnir c -5 -t0 -q /tmp/mt/a.gl /tmp/mt/src
          ./gleipnir t -D /tmp/mt/a.gl
          ./gleipnir x -q /tmp/mt/a.gl /tmp/mt/out
          cmp /tmp/mt/src/rand.bin /tmp/mt/out/rand.bin
          cmp /tmp/mt/src/code.c   /tmp/mt/out/code.c

      - uses: actions/download-artifact@v8
        with:
          name: archive-from-linux
          path: .

      - name: Read the Linux-written archive on Apple Silicon
        run: |
          ./gleipnir t a.gl
          ./gleipnir l a.gl
          ./gleipnir x -q a.gl out
          test -f out/code.c && test -f out/rand.bin
          echo "x86-64 -> arm64 read OK"

  # The format claim in the README is that an archive written on one platform
  # reads on the other.  That is worth testing rather than asserting: it is
  # exactly the sort of thing that breaks quietly on a struct padding or
  # endianness assumption and is only noticed by whoever needed the restore.
  cross-platform:
    needs: [linux, windows]
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zlib
            make
      - name: Build for this platform
        run: make CC=gcc
      - uses: actions/download-artifact@v8
        with:
          name: archive-from-linux
          path: .
      - name: Read the Linux-written archive on Windows
        run: |
          ./gleipnir t a.gl
          ./gleipnir l a.gl
          ./gleipnir x -q a.gl out
          test -f out/code.c && test -f out/rand.bin
          echo "cross-platform read OK"

  # Publish. Runs only when a version tag (v1.2.3) is pushed, and only after the
  # build/test jobs above have passed on that same commit -- so nothing ships
  # that has not round-tripped and cross-platform-verified. It gathers the four
  # binaries built above, writes a SHA-256 next to each, and attaches all eight
  # files to the release for the tag (creating it with generated notes if it
  # does not exist yet). Re-running is safe: --clobber replaces same-named
  # assets rather than erroring.
  release:
    needs: [linux, windows, cross-platform]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine version
        run: echo "GLEIPNIR_VER=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Download every build artifact
        uses: actions/download-artifact@v8
        with:
          path: art

      - name: Lay out the release files with checksums
        run: |
          set -euo pipefail
          mkdir -p out
          cp "art/gleipnir-linux-x86_64/gleipnir"            "out/gleipnir-linux-x86_64"
          cp "art/gleipnir-windows-x86_64/gleipnir.exe"      "out/gleipnir.exe"
          cp "art/gleipnir-windows-zip/gleipnir-windows-x86_64.zip" "out/"
          cp art/gleipnir-windows-setup/gleipnir-*-setup.exe "out/"
          cd out
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - name: Create or update the release, attach the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${GLEIPNIR_VER}"
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" \
              --title "Gleipnir ${GLEIPNIR_VER}" --generate-notes
          fi
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber out/*
