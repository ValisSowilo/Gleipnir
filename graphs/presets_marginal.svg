<text class="tagb" x="431.0" y="194.8" text-anchor="middle">13.2x</text>
<text class="lbl" x="431.0" y="383.0" text-anchor="middle">-2→-3</text>
<text class="sub" x="431.0" y="397.0" text-anchor="middle">-2.27% size</text>
<rect x="508.2" y="214.1" width="54.2" height="151.9" fill="#d29922" opacity="1.0" rx="1.5"/>
<text class="tagb" x="535.3" y="208.1" text-anchor="middle">12.2x</text>
<text class="lbl" x="535.3" y="383.0" text-anchor="middle">-3→-5</text>
<text class="sub" x="535.3" y="397.0" text-anchor="middle">-3.52% size</text>
<rect x="612.5" y="258.5" width="54.2" height="107.5" fill="#d29922" opacity="1.0" rx="1.5"/>
<text class="tagb" x="639.6" y="252.5" text-anchor="middle">8.6x</text>
<text class="lbl" x="639.6" y="383.0" text-anchor="middle">-5→-7</text>
<text class="sub" x="639.6" y="397.0" text-anchor="middle">-4.31% size</text>
<rect x="716.7" y="124.3" width="54.2" height="241.7" fill="#d29922" opacity="1.0" rx="1.5"/>
<text class="tagb" x="743.9" y="118.3" text-anchor="middle">19.4x</text>
<text class="lbl" x="743.9" y="383.0" text-anchor="middle">-7→-9</text>
<text class="sub" x="743.9" y="397.0" text-anchor="middle">-2.57% size</text>
<text class="sub" x="74.0" y="91.0" text-anchor="start">lower is a better deal: % more time spent per % of size saved</text>
</svg>
