<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="system-ui">
<style>
  .bg   { fill: #ffffff; }
  .fg   { fill: #1b1f23; }
  .grid { stroke: #d8dee4; stroke-width: 1; }
  .axis { stroke: #57606a; stroke-width: 1.2; }
  .lbl  { fill: #57606a; font: 12px system-ui, -apple-system, Segoe UI, sans-serif; }
  .ttl  { fill: #1b1f23; font: 600 15px system-ui, -apple-system, Segoe UI, sans-serif; }
  .sub  { fill: #57606a; font: 11px system-ui, -apple-system, Segoe UI, sans-serif; }
  .tag  { fill: #1b1f23; font: 11px system-ui, -apple-system, Segoe UI, sans-serif; }
  .tagb { fill: #1b1f23; font: 600 11px system-ui, -apple-system, Segoe UI, sans-serif; }
  .gen  { stroke: #0969da; fill: #0969da; }
  .genl { stroke: #0969da; stroke-width: 2.2; fill: none; }
  .oldl { stroke: #8c959f; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
  .oldd { stroke: #8c959f; fill: none; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill: #0d1117; }
    .fg   { fill: #e6edf3; }
    .grid { stroke: #30363d; }
    .axis { stroke: #8b949e; }
    .lbl  { fill: #8b949e; }
    .ttl  { fill: #e6edf3; }
    .sub  { fill: #8b949e; }
    .tag  { fill: #e6edf3; }
    .tagb { fill: #e6edf3; }
    .gen  { stroke: #58a6ff; fill: #58a6ff; }
    .genl { stroke: #58a6ff; }
    .oldl { stroke: #6e7681; }
    .oldd { stroke: #6e7681; }
  }
</style>
<rect class="bg" width="820" height="440"/>
<text class="ttl" x="20" y="22">The exchange rate between adjacent presets</text>
<text class="sub" x="20" y="39">Silesia, 211,938,580 bytes, single thread, genv2.exe. All presets and all reference codecs measured in ONE interleaved session; -7 and zpaq</text>
<text class="sub" x="20" y="54">repeated as drift sentinels (-7 spans 6%).</text>
<text class="lbl" x="431.0" y="430" text-anchor="middle">step up the ladder</text>
<text class="lbl" x="14" y="221.0" text-anchor="middle" transform="rotate(-90 14 221.0)">extra time per 1% of size saved</text>
<line class="grid" x1="66" y1="366.0" x2="796" y2="366.0"/>
