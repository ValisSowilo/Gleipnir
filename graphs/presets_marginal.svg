<text class="lbl" x="222.4" y="383.0" text-anchor="middle">-1→-f2</text>
<text class="sub" x="222.4" y="397.0" text-anchor="middle">-3.97% size</text>
<rect x="299.6" y="249.7" width="54.2" height="116.3" fill="#d29922" opacity="1.0" rx="1.5"/>
<text class="tagb" x="326.7" y="243.7" text-anchor="middle">9.3x</text>
<text class="lbl" x="326.7" y="383.0" text-anchor="middle">-f2→-2</text>
