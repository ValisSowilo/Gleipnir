<text class="lbl" x="535.3" y="383.0" text-anchor="middle">-3→-5</text>
<text class="sub" x="535.3" y="397.0" text-anchor="middle">-3.13% size</text>
<rect x="612.5" y="231.5" width="54.2" height="134.5" fill="#1a7f37" opacity="1.0" rx="1.5"/>
