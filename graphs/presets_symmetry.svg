<circle cx="503.3" cy="100.6" r="5" class="gen"/>
<circle cx="473.3" cy="126.1" r="5" class="gen"/>
<circle cx="431.3" cy="158.9" r="5" class="gen"/>
<circle cx="403.3" cy="182.4" r="5" class="gen"/>
<circle cx="344.2" cy="227.3" r="5" class="gen"/>
