<line x1="66.0" y1="444.0" x2="536.0" y2="76.0" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="5 4"/>
<circle cx="504.2" cy="100.9" r="5" class="gen"/>
<circle cx="460.7" cy="134.3" r="5" class="gen"/>
<circle cx="436.4" cy="161.9" r="5" class="gen"/>
<circle cx="393.2" cy="188.1" r="5" class="gen"/>
<circle cx="329.1" cy="237.6" r="5" class="gen"/>
<circle cx="260.0" cy="295.0" r="5" class="gen"/>
<circle cx="193.9" cy="350.4" r="5" class="gen"/>
