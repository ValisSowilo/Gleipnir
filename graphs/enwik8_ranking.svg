<svg xmlns="http://www.w3.org/2000/svg" width="860" height="462" viewBox="0 0 860 462" font-family="system-ui">
<style>
  .bg   { fill: #ffffff; }
  .fg   { fill: #1b1f23; }
  .grid { stroke: #d8dee4; stroke-width: 1; }
  .axis { stroke: #57606a; stroke-width: 1.2; }
  .lbl  { fill: #57606a; font: 12px system-ui, -apple-system, Segoe UI, sans-serif; }
  .ttl  { fill: #1b1f23; font: 600 15px system-ui, -apple-system, Segoe UI, sans-serif; }
  .sub  { fill: #57606a; font: 11px system-ui, -apple-system, Segoe UI, sans-serif; }
  .tag  { fill: #1b1f23; font: 11px system-ui, -apple-system, Segoe UI, sans-serif; }
  .tagb { fill: #1b1f23; font: 600 11px system-ui, -apple-system, Segoe UI, sans-serif; }
  .gen  { stroke: #0969da; fill: #0969da; }
  .genl { stroke: #0969da; stroke-width: 2.2; fill: none; }
  .oldl { stroke: #8c959f; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
  .oldd { stroke: #8c959f; fill: none; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill: #0d1117; }
    .fg   { fill: #e6edf3; }
    .grid { stroke: #30363d; }
    .axis { stroke: #8b949e; }
    .lbl  { fill: #8b949e; }
    .ttl  { fill: #e6edf3; }
    .sub  { fill: #8b949e; }
    .tag  { fill: #e6edf3; }
    .tagb { fill: #e6edf3; }
    .gen  { stroke: #58a6ff; fill: #58a6ff; }
    .genl { stroke: #58a6ff; }
    .oldl { stroke: #6e7681; }
    .oldd { stroke: #6e7681; }
  }
</style>
<rect class="bg" width="860" height="462"/>
<text class="ttl" x="20" y="22">enwik8 — 100 MB of Wikipedia text</text>
<text class="sub" x="20" y="39">nyx measured here on the released binary, round-trip verified. The rest are LTCB published sizes (Mahoney's hardware); bits per byte is size-only,</text>
<text class="sub" x="20" y="54">so it is machine-independent and comparable.</text>
<text class="lbl" x="419.0" y="452" text-anchor="middle">bits per byte — lower is better</text>
